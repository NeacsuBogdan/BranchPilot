<h2 mat-dialog-title>{{ isEditMode ? 'Edit customer' : 'Add customer' }}</h2>

<mat-dialog-content class="customer-dialog">
  <form [formGroup]="form" class="customer-dialog__form">
    <div class="customer-dialog__grid">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone number</mat-label>
        <input matInput formControlName="phoneNumber" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Notes</mat-label>
      <textarea matInput rows="4" formControlName="notes"></textarea>
    </mat-form-field>

    @if (isEditMode) {
      <mat-checkbox formControlName="isActive">Customer is active</mat-checkbox>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cancel</button>
  <button mat-flat-button type="button" (click)="submit()">
    {{ isEditMode ? 'Save changes' : 'Create customer' }}
  </button>
</mat-dialog-actions>
